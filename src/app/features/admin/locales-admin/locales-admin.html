<div class="locales-admin">
  <div class="locales-header">
    <label class="filter-field">
      <p-checkbox
        [ngModel]="soloSinProvincia()"
        (ngModelChange)="setSoloSinProvincia($event)"
        [binary]="true"
        inputId="solo-sin-provincia"
      />
      Solo sin provincia
      @if (sinProvinciaCount() > 0) {
        <p-tag [value]="sinProvinciaCount() + ' sin clasificar'" severity="warn" />
      }
    </label>
    <p-button label="Nuevo local" icon="pi pi-plus" (onClick)="nuevo()" />
  </div>

  <p-table [value]="filteredLocales()" [loading]="loading()" [paginator]="true" [rows]="10" dataKey="id">
    <ng-template #header>
      <tr>
        <th>Nombre</th>
        <th>Tipo</th>
        <th>Provincia</th>
        <th>Estado</th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template #body let-local>
      <tr>
        <td>{{ local.nombre }}</td>
        <td>{{ local.tipoLocalNombre || '—' }}</td>
        <td>
          @if (local.provinciaNombre) {
            {{ local.provinciaNombre }}
          } @else {
            <p-tag value="Sin asignar" severity="warn" />
          }
        </td>
        <td>
          <p-tag
            [value]="local.activo !== false ? 'Activo' : 'Inactivo'"
            [severity]="local.activo !== false ? 'success' : 'secondary'"
          />
        </td>
        <td class="row-actions">
          <p-button icon="pi pi-pencil" [text]="true" (onClick)="editar(local)" />
          <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="eliminar(local)" />
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="5">No hay locales registrados.</td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [(visible)]="dialogVisible"
    [modal]="true"
    [style]="{ width: '420px' }"
    [header]="editingId() != null ? 'Editar local' : 'Nuevo local'"
  >
    <form [formGroup]="form" (ngSubmit)="guardar()" class="locales-form">
      <div class="field">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" pInputText formControlName="nombre" class="w-full" />
      </div>

      <div class="field">
        <label for="tipoLocal">Tipo de local</label>
        <p-select
          inputId="tipoLocal"
          formControlName="tipoLocalId"
          [options]="tiposLocal()"
          optionLabel="nombre"
          optionValue="id"
          placeholder="Sin clasificar"
          [showClear]="true"
          [style]="{ width: '100%' }"
          appendTo="body"
        />
      </div>

      <div class="field">
        <label for="provincia">Provincia</label>
        <p-select
          inputId="provincia"
          formControlName="provinciaId"
          [options]="provincias()"
          optionLabel="nombre"
          optionValue="id"
          placeholder="Sin asignar"
          [showClear]="true"
          [style]="{ width: '100%' }"
          appendTo="body"
        />
      </div>

      <div class="checkbox-field">
        <p-checkbox formControlName="activo" [binary]="true" inputId="activo" />
        <label for="activo">Local activo</label>
      </div>

      <div class="dialog-actions">
        <p-button label="Cancelar" severity="secondary" [text]="true" type="button" (onClick)="cancelar()" />
        <p-button label="Guardar" type="submit" [loading]="saving()" />
      </div>
    </form>
  </p-dialog>
</div>
