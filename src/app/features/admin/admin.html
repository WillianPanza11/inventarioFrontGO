<p-confirmDialog />

<p-tabs value="locales">
  <p-tablist>
    <p-tab value="locales">Locales</p-tab>
    <p-tab value="secciones">Secciones</p-tab>
    <p-tab value="mapeo">Mapeo de red</p-tab>
  </p-tablist>
  <p-tabpanels>
    <p-tabpanel value="locales">
      <app-catalog-admin
        [service]="localesAdapter"
        itemLabel="local"
        newLabel="Nuevo local"
        emptyMessage="No hay locales registrados."
      />
    </p-tabpanel>
    <p-tabpanel value="secciones">
      <app-catalog-admin
        [service]="seccionesAdapter"
        itemLabel="sección"
        newLabel="Nueva sección"
        emptyMessage="No hay secciones registradas."
      />
    </p-tabpanel>
    <p-tabpanel value="mapeo">
      <app-network-mapping-admin />
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>
