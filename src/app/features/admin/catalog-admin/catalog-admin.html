<div class="catalog-admin">
  <div class="catalog-header">
    <p-button label="Nuevo" icon="pi pi-plus" (onClick)="nuevo()" />
  </div>

  <p-table [value]="items()" [loading]="loading()" [paginator]="true" [rows]="10" dataKey="id">
    <ng-template #header>
      <tr>
        <th>Nombre</th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template #body let-item>
      <tr>
        <td>{{ item.nombre }}</td>
        <td class="row-actions">
          <p-button icon="pi pi-pencil" [text]="true" (onClick)="editar(item)" />
          <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="eliminar(item)" />
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="2">{{ emptyMessage() }}</td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '380px' }" [header]="dialogTitle()">
    <form [formGroup]="form" (ngSubmit)="guardar()" class="catalog-form">
      <div class="field">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" pInputText formControlName="nombre" class="w-full" />
      </div>
      <div class="dialog-actions">
        <p-button label="Cancelar" severity="secondary" [text]="true" type="button" (onClick)="cancelar()" />
        <p-button label="Guardar" type="submit" [loading]="saving()" />
      </div>
    </form>
  </p-dialog>
</div>
