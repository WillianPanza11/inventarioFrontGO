<div class="login-page">
  <p-card header="Inventario Handhelds" class="login-card">
    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" type="text" pInputText formControlName="username" autocomplete="username" class="w-full" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <p-password
          inputId="password"
          formControlName="password"
          [toggleMask]="true"
          [feedback]="false"
          styleClass="w-full"
          inputStyleClass="w-full"
          autocomplete="current-password"
        />
      </div>

      @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" />
      }

      <p-button type="submit" label="Ingresar" styleClass="w-full" [loading]="loading()" />
    </form>
  </p-card>
</div>
